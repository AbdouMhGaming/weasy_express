<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply only a previously chosen theme before CSS/React paints.
      try {
        document.documentElement.classList.toggle("dark", localStorage.getItem("weasy-theme") === "dark");
      } catch {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Weasy Express — Livraison rapide en Algérie</title>
    <meta name="description" content="Weasy Express est votre partenaire de confiance pour la livraison rapide et fiable en Algérie. Service pour particuliers et e-commerce.">
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#E10600" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weasy Express" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
